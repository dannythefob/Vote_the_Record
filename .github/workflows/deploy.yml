# Fallback deploy: build here and upload to Cloudflare Workers, for use only if
# Cloudflare's own build (Workers Builds, connected to this repo) can't run the build.
# Settings come from wrangler.jsonc, the same file Cloudflare's build uses.
#
# Setup (one time):
#   1. In GitHub repo settings, add secrets CLOUDFLARE_API_TOKEN (permission:
#      Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID. Never commit these.
#   2. To deploy on every push to main, set the repo variable DEPLOY_VIA_ACTIONS=true
#      and turn off automatic builds in the Cloudflare dashboard so the two don't race.
#      Otherwise run this workflow by hand from the Actions tab.
name: deploy (fallback)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_VIA_ACTIONS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
        env:
          REQUIRE_NODE: "1"
      - run: python src/build/build.py
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
