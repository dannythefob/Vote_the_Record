name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: python src/validate/validate.py
      - name: Tests (Python, JS scoring, headless Chrome)
        run: python -m pytest tests -q
        env:
          REQUIRE_NODE: "1"
          REQUIRE_BROWSER: "1"
      - name: Build site (fails if the validator fails)
        run: python src/build/build.py
