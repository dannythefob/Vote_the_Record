  title: Austin's 2025 vote on a bigger property tax increase (Proposition Q)
  status: decided
  date: '2025-11-20'
  decided_by: Austin City Council
  locality: city-of-austin
  what_happened: 'In August 2025 the council voted 11-0 to ask voters for a city tax rate of $0.574017 per $100 of property
    value, 5 cents above the highest rate it could set without an election, to pay for things like housing and homelessness,
    parks, public health, and public safety. On November 4, 2025, voters said no: 62,952 for and 109,375 against. On November
    20 the council voted 11-0 to cut the budget to match and set a lower rate of $0.524017.'
  how_it_affects_you: Your city council sets your city property tax rate and decides what the money pays for. Here the council's
    plan needed voters' approval, and voters turned it down.
