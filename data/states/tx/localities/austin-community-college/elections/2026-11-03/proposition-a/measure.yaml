# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: Austin Community College District, Proposition A
election_date: '2026-11-03'
kind: other
ballot_text: 'THIS IS A TAX INCREASE. Approving the annexation by the Austin Community College District of the following territory: the territory in the Pflugerville Independent School District that is not already within the Austin Community College taxing district, and authorizing the imposition of an ad valorem tax for junior college purposes, which is currently set at a rate of $0.1034, per $100 valuation of taxable property.'
choices:
- FOR
- AGAINST
