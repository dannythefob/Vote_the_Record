  headline: District maps used to assign each precinct its districts
  statement: 'The Bexar County precinct layer lists precinct numbers only, so each precinct was assigned the district that covers most of it on these official maps: Texas Legislative Council: PLANC2333 (congressional districts enacted 2025, 89th Legislature, 2nd C.S.) (https://data.capitol.texas.gov/dataset/748c952b-e926-4f44-8d01-a738884b3ec8/resource/5712ebe1-d777-4d4a-b836-0534e17bca01/download/planc2333.zip); Texas Legislative Council: PLANH2316 (State House districts, 2023-2026) (https://data.capitol.texas.gov/dataset/71af633c-21bf-42cf-ad48-4fe95593a897/resource/a4d3230f-47f2-4253-85f3-51a6c3c9ad0a/download/planh2316.zip); Texas Legislative Council: PLANS2168 (State Senate districts) (https://data.capitol.texas.gov/dataset/70836384-f10c-423d-a36e-748d7e000872/resource/8247dbc6-b942-4a29-813c-1ebc603a7236/download/plans2168.zip); Bexar County GIS: Commissioner Precincts (https://maps.bexar.org/arcgis/rest/services/CommissionerPrecincts/MapServer/0); Bexar County GIS: Justice of the Peace Precincts (https://maps.bexar.org/arcgis/rest/services/JusticeofthePeace/MapServer/1).'
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://data.capitol.texas.gov/dataset/748c952b-e926-4f44-8d01-a738884b3ec8/resource/5712ebe1-d777-4d4a-b836-0534e17bca01/download/planc2333.zip
  source_title: Texas Legislative Council and county district maps
  source_kind: page
  sha256: null
  archive_url: null
  event_date: '2026-10-07'
  retrieved: '2026-10-07'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read on 2026-10-07; SHA-256 of the downloaded files: a63fa6dd323d0c6915db6380e3162bb0c7d17ac5aca216f19388310d261dce05. Each precinct and district was laid on a 0.001-degree grid (and a finer grid of points inside the precinct for small precincts); a precinct takes the district covering at least 95% of it. Checked against Harris and Dallas counties, whose precinct layers list districts: the method matched every Harris precinct and all but one Dallas precinct (which covered under 95% and would be flagged). Precincts below the threshold are listed as split between the districts covering them ("depends on your address"): precinct 3179: us-house 21 covers 91%; precinct 3179: state-house 123 covers 91%; precinct 3208: state-senate 26 covers 92%; precinct 4202: state-senate 19 covers 89%; precinct 4212: state-senate 21 covers 62%.'
