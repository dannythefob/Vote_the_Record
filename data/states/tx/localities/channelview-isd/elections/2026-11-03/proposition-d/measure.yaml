  headline: The district can't issue these bonds or levy the tax to repay them unless a majority of voters approve
  statement: 'Education Code § 45.003(a): "Bonds described by Section 45.001 may not be issued and taxes described by Section 45.001 or 45.002 may not be levied unless authorized by a majority of the qualified voters of the district, voting at an election held for that purpose ..."'
