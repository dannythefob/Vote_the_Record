# Proposition: exact wording and choices as printed on the Harris County sample ballot. Unverified.
name: Channelview ISD, Proposition D
election_date: '2026-11-03'
kind: bond
ballot_text: THIS IS A PROPERTY TAX INCREASE The issuance of $8,815,000 bonds for the construction, renovation and equipment of the Jennings Athletic Complex; and the levying of a tax to pay the principal of and interest on the bonds and the costs of any related credit agreements.
choices:
- FOR
- AGAINST
