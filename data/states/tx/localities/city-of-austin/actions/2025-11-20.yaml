  headline: After Proposition Q failed, the council amended the budget and set the rate at the voter-approval rate
  statement: On November 20, 2025, the Austin City Council approved Ordinance No. 20251120-004, amending the Fiscal Year 2025-2026 budget "to reflect reduced projected property (ad valorem) tax revenues resulting from the voters not approving the property tax rate adopted by the City Council," and Ordinance No. 20251120-006, adopting a tax rate of 0.524017 dollars per hundred dollar valuation, "which is effectively a 8.4 percent increase in the tax rate." Both passed 11-0.
