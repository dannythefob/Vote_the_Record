  headline: 'Estimated cost with interest: about $453 million'
  statement: The city's Voter Information Document for this proposition lists $260,000,000 in principal, $193,357,500 in estimated interest (presuming a 6% interest rate), and $453,357,500 in estimated combined principal and interest.
