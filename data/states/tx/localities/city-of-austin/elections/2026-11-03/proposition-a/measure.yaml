- id: tx/localities/city-of-austin/elections/2026-11-03/proposition-a/measure#E-04
  headline: The city's existing debt
  statement: The bond election ordinance states that, as of its adoption, the City's outstanding debt principal totaled $2,378,150,000, the interest owed on that debt through maturity totaled $963,306,343, and the City's debt service tax rate was $0.113735 per $100 of taxable value. It says the maximum interest rate for any bonds approved is 6.00%.
