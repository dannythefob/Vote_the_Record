# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Austin, Proposition A
election_date: '2026-11-03'
kind: bond
ballot_text: THIS IS A TAX INCREASE; the issuance of bonds in the amount of $260,000,000 for citywide park, recreation, aquatic, and open space improvements, and the levy of taxes sufficient to pay the principle of and interest in bonds.
choices:
- FOR
- AGAINST
explained:
- id: tx/localities/city-of-austin/elections/2026-11-03/proposition-a/measure#E-01
  headline: What the $260 million is for
  statement: The ordinance's full proposition authorizes up to $260,000,000 in bonds for city park, recreation (including sports, athletics, and aquatics), and open space improvements, "with priority given to" building improvements at the Gus Garcia Recreation Center, Doris Miller Auditorium, and Mayfield Park; trail, park, and electrification infrastructure at listed parks; parkland improvements at listed parks; improvements at Garrison, Big Stacy, Walnut Creek, and Civitan pools; and parkland acquisition.
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://services.austintexas.gov/edims/document.cfm?id=478892
  source_title: 'City of Austin: Ordinance No. 20260806-002, ordering a General Obligation Bond Election for November 3, 2026'
