  headline: 'Estimated tax impact: up to $1.10 a year on a $100,000 home'
  statement: The Voter Information Document lists $1.10 as the estimated maximum annual tax increase on a residence homestead appraised at $100,000, assuming a $20,000 homestead exemption.
