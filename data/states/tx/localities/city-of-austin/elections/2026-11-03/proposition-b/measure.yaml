# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Austin, Proposition B
election_date: '2026-11-03'
kind: bond
ballot_text: THIS IS A TAX INCREASE; the issuance of bonds in the amount of $35,000,000 for library facilities and the levy of taxes sufficient to pay the principal of and interest on the bonds.
choices:
- FOR
- AGAINST
explained:
- id: tx/localities/city-of-austin/elections/2026-11-03/proposition-b/measure#E-01
  headline: What the $35 million is for
  statement: The ordinance's full proposition authorizes up to $35,000,000 in bonds for library facilities, "with priority given to the existing Hampton at Oak Hill branch library and a new Colony Park branch library."
  label: official_record
  claim_status: documented
  contradicted_by: []
