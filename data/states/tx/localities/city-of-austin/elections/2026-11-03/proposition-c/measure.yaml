# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Austin, Proposition C
election_date: '2026-11-03'
kind: charter-amendment
ballot_text: Shall the City Charter be amended to clarify that the Independent Citizens Redistricting Commission (ICRC) is independent of City Council control, allow the ICRC to review City districts after changes to the City’s boundary lines, create voter registration and residency duration exceptions for student members, provide an effective date for the redistricting plan adopted by the ICRC, increase the potential appointees to the ICRC, clarify the method and timing of filing vacancies on the ICRC, and allow City staff to communicate with the ICRC outside of meeting as long as such communication is in compliance with the Texas Open Meetings Act?
choices:
- FOR
- AGAINST
explained: []
