  headline: The City Council voted 11-0 to put the charter amendments on the ballot
  statement: On August 6, 2026, the Austin City Council approved Ordinance No. 20260806-004, calling the charter amendment election with Propositions C through J, on an 11-0 vote. The ordinance's title says the propositions include "a citizen-initiated charter amendment certified sufficient on June 22, 2026."
