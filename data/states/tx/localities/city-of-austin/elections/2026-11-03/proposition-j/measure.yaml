# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Austin, Proposition J
election_date: '2026-11-03'
kind: charter-amendment
ballot_text: Shall the City Charter be amended to make non-substantive corrections of typographical errors, punctuation, and sentence structure, and to change or remove language that is moot or unenforceable because it has been superseded by state law or by a final court order?
choices:
- FOR
- AGAINST
explained:
