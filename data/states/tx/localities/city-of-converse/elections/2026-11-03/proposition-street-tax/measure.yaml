# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Converse, Proposition on the street maintenance sales tax
election_date: '2026-11-03'
kind: other
ballot_text: The Reauthorization of the Local Sales and Use Tax in the City of Converse, Texas, at the rate of 1/4 Percent to continue providing revenue for maintenance and repair of municipal streets. The tax expires on the fourth anniversary of the date of this election unless the imposition of the tax is reauthorized.
choices:
- For
- Against
