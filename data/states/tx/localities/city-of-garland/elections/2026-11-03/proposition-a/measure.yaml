# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Garland, Proposition A
election_date: '2026-11-03'
kind: tax-rate
ballot_text: THIS IS A TAX INCREASE Approving the ad valorem tax rate of $0.679900 per $100 valuation in the City of Garland, Texas for the current year, a rate that is $0.036646 higher per $100 of valuation than the voter-approval tax rate of the City of Garland, Texas, for the purpose of increasing staff for the police department, fire department, 9-1-1 dispatch department and parks department, increasing funding for roadway construction and maintenance, maintaining and enhancing levels of city-wide services and competitive pay for public safety and city personnel. Last year, the ad valorem tax rate in the City of Garland, Texas was $0.689746 per $100 valuation.
choices:
- For
- Against
explained:
- id: tx/localities/city-of-garland/elections/2026-11-03/proposition-a/measure#E-01
  headline: Voters must approve this rate because it is above the voter-approval rate
  statement: 'Tax Code § 26.07(b) applies to taxing units other than school districts: when the governing body adopts a tax rate above the unit''s voter-approval tax rate (or, for some units, above the greater of that rate and its de minimis rate), "the registered voters of the taxing unit at an election held for that purpose must determine whether to approve the adopted tax rate."'
