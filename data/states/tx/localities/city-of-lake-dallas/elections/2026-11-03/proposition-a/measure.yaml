ballot_text: The reauthorization of the local sales and use tax in the City of Lake Dallas at the rate of one-fourth of one percent to continue providing revenue for maintenance and repair of municipal streets. The tax expires on the 5th anniversary of the date of this election unless the imposition of the tax is reauthorized.
