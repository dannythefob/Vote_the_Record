# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Pflugerville, Proposition G
election_date: '2026-11-03'
kind: charter-amendment
ballot_text: Shall the City of Pflugerville City Charter be amended to revise the requirements governing the development and content of the Citys annual budget, including requiring that the City Manager prepare and present the budget in accordance with Government Finance Officers Association budget-award guidelines, requiring comparative budget information and a five-year financial forecast, and to add a new charter section requiring a publicly accessible reporting system and final close-out reports for major capital projects?
choices:
- FOR
- AGAINST
