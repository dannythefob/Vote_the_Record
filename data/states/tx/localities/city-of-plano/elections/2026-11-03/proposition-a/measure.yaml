# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: City of Plano, Proposition A
election_date: '2026-11-03'
kind: other
ballot_text: 'THIS IS A TAX INCREASE; Authorizing the City’s venue project, specifically being a new multipurpose arena for professional or amateur sports, entertainment, and civic events in The Shops at Willow Bend shopping mall area in the City, and authorizing imposition of one or more of the following for the purpose of financing the venue project: (1) a short-term motor vehicle rental tax in the City at a rate not to exceed 5%; (2) an event parking tax at the venue project not to exceed $3.00 per vehicle; (3) an event admissions tax at the venue project at a rate not to exceed 10% of each ticket price; (4) a venue facility use tax in an amount not to exceed $5,000 per game on each member of a major league team that plays a professional sports game at the venue project; (5) a hotel occupancy tax in the City at a rate not to exceed 2% of the room price. If approved, the maximum hotel occupancy tax rate imposed from all sources in the City of Plano would be 15% of the price paid for a room in a hotel.'
choices:
- For
- Against
explained: []
