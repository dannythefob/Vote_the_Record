- id: tx/localities/collin-county/elections/2026-11-03/precincts#S-01
  headline: Collin County voting precincts (2026)
  statement: 'Collin County''s GIS layer of voting precincts (273 precincts), published by Collin County GIS, gives each precinct''s number and outline and its Commissioners Court and justice of the peace precincts; the layer says the precincts were approved by the Commissioners Court on 9/25/2023 (Court Order #2023-915-09-25), effective 1/1/2024.'
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://www.arcgis.com/home/item.html?id=26cdf0cddc2849e1af691ac234f3340a
  source_title: 'Collin County GIS: Voting Precincts'
  source_kind: page
  sha256: null
  archive_url: null
  event_date: '2026-10-08'
  retrieved: '2026-10-08'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read from https://services1.arcgis.com/fdWXd5OobWR1E3er/arcgis/rest/services/Voting_Precincts/FeatureServer/0 on 2026-10-08; SHA-256 of the downloaded query responses: 373119372253f7c4d32bdeb8c8e1a35236284fdae587736457f76636f9ecea56. Congressional, State House and State Senate districts were assigned by overlaying the district maps named in precincts#S-05; the layer''s own district fields and officeholder names are not used.'
- id: tx/localities/collin-county/elections/2026-11-03/precincts#S-02
  headline: The 2025 congressional map (plan C2333) is in use for 2026
  statement: On December 4, 2025, the U.S. Supreme Court granted Texas's application to stay the November 18, 2025 district court order that had blocked the new congressional map, allowing it to be used.
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://www.supremecourt.gov/opinions/25pdf/25a608_7khn.pdf
  source_title: 'Supreme Court of the United States: Abbott v. LULAC, No. 25A608, order of December 4, 2025'
  source_kind: document
  sha256: 980b35bc80a5e7fd33e109ea783ecf60135405f71014a6d2cecb3adf92b6f3bc
  archive_url: https://web.archive.org/web/20260930221333/https://www.supremecourt.gov/opinions/25pdf/25a608_7khn.pdf
  event_date: '2026-10-08'
  retrieved: '2026-10-08'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: The Collin County layer's precincts took effect 1/1/2024, before the 2025 congressional map, so congressional districts come from the Texas Legislative Council's PLANC2333 shapefile instead.
