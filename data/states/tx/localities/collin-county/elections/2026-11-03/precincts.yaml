  notes: 'Read on 2026-10-08; SHA-256 of the downloaded query responses: f152067890f00b81dc93b33dc4845e41a61e2f6d79372e2e2144ca0b99231d67. Areas used: bland-isd (layer 14, GEOID 4810350), city-of-anna (layer 28, GEOID 4803300), city-of-dallas (layer 28, GEOID 4819000), city-of-garland (layer 28, GEOID 4829000), city-of-josephine (layer 28, GEOID 4838068), city-of-lavon (layer 28, GEOID 4841800), city-of-lowry-crossing (layer 28, GEOID 4844308), city-of-plano (layer 28, GEOID 4858016), city-of-princeton (layer 28, GEOID 4859576), city-of-weston (layer 28, GEOID 4877740), city-of-wylie (layer 28, GEOID 4880356), mckinney-isd (layer 14, GEOID 4829850), princeton-isd (layer 14, GEOID 4835850), wylie-isd (layer 14, GEOID 4846530). A precinct or ZIP code at least 99% inside an area counts as inside it; one at least 1% inside, or holding at least 1% of the area, is marked as depending on the address. The address lookup uses the outlines directly.'
