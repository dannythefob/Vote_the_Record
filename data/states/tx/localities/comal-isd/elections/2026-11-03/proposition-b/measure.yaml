# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: Comal ISD, Proposition B
election_date: '2026-11-03'
kind: bond
ballot_text: THIS IS A PROPERTY TAX INCREASE. The issuance of bonds in an amount not to exceed $27,045,000 by the Comal Independent School District for the acquisition, improvement, and updates of technology equipment, systems, and infrastructure (including new classroom computers and devices), and the levying of a tax sufficient to pay the principal of and interest on the bonds and the cost of any credit agreements executed in connection with the bonds.
choices:
- FOR
- AGAINST
