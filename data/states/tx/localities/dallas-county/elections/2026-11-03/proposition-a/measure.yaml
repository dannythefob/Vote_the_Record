# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: Dallas County, Proposition A
election_date: '2026-11-03'
kind: tax-rate
ballot_text: THIS IS A TAX INCREASE "Approving the ad valorem tax rate of $0.248650 per $100 valuation in County of Dallas for the current year, a rate that is $0.02400 higher per $100 valuation than the voter-approval tax rate of the County of Dallas, for the purpose of funding programs that measurably reduce homelessness and resolve encampments to improve neighborhood vibrancy, support homeless people to achieve self-sufficiency, increase access to mental health treatment and support programs that provide stable housing. Last year, the ad valorem tax rate in Dallas County was $0.215500 per $100 valuation.”
choices:
- For
- Against
