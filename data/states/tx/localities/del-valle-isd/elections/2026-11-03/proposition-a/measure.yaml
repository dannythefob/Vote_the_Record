# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: Del Valle ISD, Proposition A
election_date: '2026-11-03'
kind: tax-rate
ballot_text: THIS IS A TAX INCREASE. Ratifying the ad valorem tax rate of $1.0328 per $100 valuation in Del Valle Independent School District for the current year, a rate that will result in an increase of 19.5% percent in maintenance and operations tax revenue for the District for the current year as compared to the preceding year, which is an additional $20,038,349.
choices:
- FOR
- AGAINST
explained:
- id: tx/localities/del-valle-isd/elections/2026-11-03/proposition-a/measure#E-01
  headline: Voters must approve this rate because it is above the district's voter-approval rate
  statement: 'Tax Code § 26.08(a): "If the governing body of a school district adopts a tax rate that exceeds the district''s voter-approval tax rate, the registered voters of the district at an election held for that purpose must determine whether to approve the adopted tax rate."'
  label: official_record
  claim_status: documented
