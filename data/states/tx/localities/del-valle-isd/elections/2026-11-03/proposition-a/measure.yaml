  headline: Del Valle ISD says homeowners with the over-65 or disabled exemption would not pay more
  statement: 'The district''s Prop A page says: "There will not be an increase in taxes for homeowners who are senior citizens or disabled persons as a result of this proposal, provided they have applied for and received the Over 65 or Disabled Homestead Exemption with the appropriate appraisal district and have made no major improvements or additions to their residence."'
