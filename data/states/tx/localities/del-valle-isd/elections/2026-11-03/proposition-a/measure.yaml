  headline: Del Valle ISD estimates $9.14 a year more for an average home
  statement: 'The district''s Prop A page says: "Based on the average home market value of $314,376 in Del Valle ISD, homeowners would see an estimated increase of $9.14 annually with the passage of Prop A. The estimated financial impact of the 2026 election includes the $140,000 standard Homestead Exemption."'
