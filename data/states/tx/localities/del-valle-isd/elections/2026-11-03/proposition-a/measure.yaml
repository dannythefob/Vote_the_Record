- id: tx/localities/del-valle-isd/elections/2026-11-03/proposition-a/measure#E-03
  headline: Del Valle ISD says it would raise $13.9 million this year for raises and the new high school
  statement: 'The district''s Prop A page says: "Proposition A would provide $13.9 million of new funding to Del Valle ISD in the current fiscal year (and is expected to provide at least as much each year thereafter) to support the district’s Maintenance & Operations (M&O) instructional budget. The funds would be used to provide additional raises to teachers and staff, as well as support programs and new staff at the district’s new second high school, set to open in 2028."'
