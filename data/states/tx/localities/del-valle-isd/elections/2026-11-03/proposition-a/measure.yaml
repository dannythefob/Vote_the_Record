name: Del Valle ISD, Proposition A
election_date: '2026-11-03'
kind: tax-rate
ballot_text: THIS IS A TAX INCREASE. Ratifying the ad valorem tax rate of $1.0328 per $100 valuation in Del Valle Independent School District for the current year, a rate that will result in an increase of 19.5% percent in maintenance and operations tax revenue for the District for the current year as compared to the preceding year, which is an additional $20,038,349.
