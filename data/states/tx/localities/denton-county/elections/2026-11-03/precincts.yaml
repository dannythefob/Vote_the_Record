  notes: 'Read on 2026-10-09; SHA-256 of the downloaded files: 41c3624b2ac510bd679c047bd0269a451075895d4e59527bf79560c6d1e10f9d. Each precinct and district was laid on a 0.001-degree grid (and a finer grid of points inside the precinct for small precincts); a precinct takes the district covering at least 95% of it. Checked against Harris and Dallas counties, whose precinct layers list districts: the method matched every Harris precinct and all but one Dallas precinct (which covered under 95% and would be flagged). Precincts below the threshold are listed as split between the districts covering them ("depends on your address"): precinct 3124: us-house 26 covers 91%; precinct 9304: us-house 26 covers 93%; precinct 3124: state-house 63 covers 91%; precinct 9304: state-house 63 covers 93%; precinct 3124: commissioner 3 covers 93%; precinct 3124: jp 3 covers 94%.'
