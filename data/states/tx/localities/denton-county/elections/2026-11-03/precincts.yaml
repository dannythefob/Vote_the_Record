- id: tx/localities/denton-county/elections/2026-11-03/precincts#S-01
  headline: Denton County voter precincts (2026)
  statement: Denton County's GIS layer "Voter Precincts (Effective 1/1/2026)" (252 precincts), published by Denton County GIS, gives each precinct's number and outline.
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://gis.dentoncounty.gov/arcgis/rest/services/PoliticalBoundaries_GC/MapServer/9
  source_title: 'Denton County GIS: Voter Precincts (Effective 1/1/2026)'
  source_kind: page
  sha256: null
  archive_url: null
  event_date: '2026-10-09'
  retrieved: '2026-10-09'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read from https://gis.dentoncounty.gov/arcgis/rest/services/PoliticalBoundaries_GC/MapServer/9 on 2026-10-09; SHA-256 of the downloaded query responses: 0183b4b617dd41ddd9122adf9082266583efda279191fa37c4a4d513a8e8d3fb. The layer lists precinct numbers only; each precinct''s districts were assigned by overlaying the district maps named in precincts#S-05. The county server resets long transfers, so its layers were downloaded in small pages; the State Board of Education layer was requested simplified to 0.0005 degrees and the commissioner and JP/constable layers to 0.0001 degrees, finer than the 0.001-degree overlay grid.'
- id: tx/localities/denton-county/elections/2026-11-03/precincts#S-02
  headline: The 2025 congressional map (plan C2333) is in use for 2026
  statement: On December 4, 2025, the U.S. Supreme Court granted Texas's application to stay the November 18, 2025 district court order that had blocked the new congressional map, allowing it to be used.
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://www.supremecourt.gov/opinions/25pdf/25a608_7khn.pdf
  source_title: 'Supreme Court of the United States: Abbott v. LULAC, No. 25A608, order of December 4, 2025'
  source_kind: document
  sha256: 980b35bc80a5e7fd33e109ea783ecf60135405f71014a6d2cecb3adf92b6f3bc
  archive_url: https://web.archive.org/web/20260930221333/https://www.supremecourt.gov/opinions/25pdf/25a608_7khn.pdf
  event_date: '2026-10-09'
  retrieved: '2026-10-09'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: Congressional districts come from the Texas Legislative Council's PLANC2333 shapefile rather than the county's own congressional layer, so the 2025 map is used.
