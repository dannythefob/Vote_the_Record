  notes: 'Read on 2026-10-09; SHA-256 of the downloaded query responses: 84c407d625e88d6b6835529d904ef29690c0db8389e94b1ce762e128ae7aa793. Areas used: city-of-dallas (layer 28, GEOID 4819000), city-of-justin (layer 28, GEOID 4838332), city-of-lake-dallas (layer 28, GEOID 4840516), city-of-plano (layer 28, GEOID 4858016), city-of-the-colony (layer 28, GEOID 4872530), town-of-bartonville (layer 28, GEOID 4805768), town-of-double-oak (layer 28, GEOID 4821028), town-of-flower-mound (layer 28, GEOID 4826232), town-of-hickory-creek (layer 28, GEOID 4833476). A precinct or ZIP code at least 99% inside an area counts as inside it; one at least 1% inside, or holding at least 1% of the area, is marked as depending on the address. The address lookup uses the outlines directly.'
