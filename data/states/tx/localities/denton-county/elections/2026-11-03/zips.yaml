  event_date: '2026-10-09'
  retrieved: '2026-10-09'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read on 2026-10-09; SHA-256 of the downloaded query responses: 531f0cf14c6562bdf04e1a8ee12ddd7ea97605cb38d47a1e05387193e5f05aca. ZIP-to-district links were computed by overlaying these areas on the county precinct layer on a 0.001-degree grid; a precinct counts for a ZIP when it covers at least 1% of the ZIP''s grid cells in Denton County. Results are approximate; the precinct lookup is exact.'
- id: tx/localities/denton-county/elections/2026-11-03/zips#S-02
  headline: Denton County voter precincts (2026)
  statement: Denton County's GIS layer "Voter Precincts (Effective 1/1/2026)" (252 precincts), published by Denton County GIS, gives each precinct's number and outline.
  label: official_record
  claim_status: documented
  contradicted_by: []
  source_url: https://gis.dentoncounty.gov/arcgis/rest/services/PoliticalBoundaries_GC/MapServer/9
  source_title: 'Denton County GIS: Voter Precincts (Effective 1/1/2026)'
  source_kind: page
  sha256: null
  archive_url: null
  event_date: '2026-10-09'
  retrieved: '2026-10-09'
  verification: unverified
  verified_on: null
  reviewer: null
  notes: 'Read from https://gis.dentoncounty.gov/arcgis/rest/services/PoliticalBoundaries_GC/MapServer/9 on 2026-10-09; SHA-256 of the downloaded query responses: 0183b4b617dd41ddd9122adf9082266583efda279191fa37c4a4d513a8e8d3fb. The layer lists precinct numbers only; each precinct''s districts were assigned by overlaying the district maps named in precincts#S-05. The county server resets long transfers, so its layers were downloaded in small pages; the State Board of Education layer was requested simplified to 0.0005 degrees and the commissioner and JP/constable layers to 0.0001 degrees, finer than the 0.001-degree overlay grid.'
