- id: tx/localities/fort-bend-county/elections/2026-11-03/county-judge/race#S-HOLDER-2
  headline: 'Who holds this office: disputed in the September 10, 2026 minutes'
  statement: The minutes of the September 10, 2026 Commissioners Court meeting record that County Attorney Bridgette Smith-Lawson "stated, KP George is still the County Judge and is suspended without pay. He is still the legal holder of that office," and that Commissioner Prestage stated "let the record reflect that if this is an invalid vote by Daniel Wong, it will make the vote 2-2." Daniel Wong presided and voted as County Judge at that meeting, and the county's elected-officials list shows him as County Judge (see S-HOLDER).
  label: official_record
