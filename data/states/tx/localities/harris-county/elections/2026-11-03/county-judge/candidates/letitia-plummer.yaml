  - id: tx/localities/harris-county/elections/2026-11-03/county-judge/candidates/letitia-plummer#R-02
    headline: Voted no on moving $23M from the Budget Stabilization Fund to storm recovery (June 2024)
    record_type: vote
    statement: >-
      As a Houston City Council member, voted no on Item 44 (June 25, 2024), an ordinance
      appropriating $23,000,000.00 out of the Budget Stabilization Fund, transferring it to the
      Disaster Recovery Fund for expenses related to the May 2024 storms, and declaring the
      City's intent to seek reimbursement from FEMA. The minutes record "Council members
      Thomas, Castillo, Martinez, Pollard, Castex-Tatum, Plummer and Alcorn voting no." The
      ordinance was adopted (Ordinance 2024-0495).
    label: official_record
    claim_status: documented
    contradicted_by: []
    source_url: https://www.houstontx.gov/citysec/agenda/2024/20240625.pdf
    source_title: Houston City Council Minutes, June 25-26, 2024 (page 13, Item 44)
