  - id: tx/localities/harris-county/elections/2026-11-03/county-judge/candidates/orlando-sanchez#R-08
    record_type: statement
    headline: Said the county needed a fuller look at its weak spots after a near $888K phishing loss
    statement: >-
      A news report said that after a phishing attempt nearly led the county to deposit $888,000 into a fraudulent bank account, Sanchez, "the Harris County treasurer, who writes the actual checks for the county, said he would like to see a more comprehensive analysis of the county's vulnerabilities," and that on Jan. 9 he "sought to hire an outside forensic financial investigation firm Briggs and Veselka."
    label: news_report
    claim_status: documented
    contradicted_by: []
