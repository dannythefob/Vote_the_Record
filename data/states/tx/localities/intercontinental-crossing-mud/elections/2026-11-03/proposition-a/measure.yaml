# Proposition: exact wording and choices as printed on the Harris County sample ballot. Unverified.
name: Intercontinental Crossing MUD, Proposition A
election_date: '2026-11-03'
kind: bond
ballot_text: THIS IS A TAX INCREASE The authority of the District to issue $70,000,000 of future bonds for the purpose of purchasing, acquiring, owning, operating, repairing, replacing, maintaining, and improving or extending the District's waterworks system, sanitary sewer system, and drainage and storm sewer systems and appurtenances for said systems of the District; and for the levy of ad valorem taxes sufficient to provide for the payment of principal and interest on such bonds, and for the issuance of bonds.
choices:
- FOR
- AGAINST
