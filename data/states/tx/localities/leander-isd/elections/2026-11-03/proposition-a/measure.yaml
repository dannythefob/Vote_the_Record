ballot_text: THIS IS A TAX INCREASE. Ratifying the ad valorem tax rate of $1.1169 per $100 valuation in Leander Independent School District for the current year, a rate that will result in an increase of 3.72 percent in maintenance and operations tax revenue for the District for the current year as compared to the preceding year, which is an additional $12,066,324.
