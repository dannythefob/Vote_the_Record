# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: Northside ISD, Proposition A
election_date: '2026-11-03'
kind: tax-rate
ballot_text: THIS IS A TAX INCREASE. Ratifying the ad valorem tax rate of $1.0349 per $100 valuation in Northside Independent School District for the current year, a rate that will result in an increase of 4.49% in maintenance and operations tax revenue for the district for the current year as compared to the preceding year, which is an additional $21,533,914.
