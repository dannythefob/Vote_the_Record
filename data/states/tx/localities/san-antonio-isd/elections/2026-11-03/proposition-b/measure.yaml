# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: San Antonio ISD, Proposition B
election_date: '2026-11-03'
kind: bond
ballot_text: THIS IS A PROPERTY TAX INCREASE. The issuance of an amount not to exceed $492,000,000 school building bonds for the construction, renovation, acquisition, and equipment of school buildings in the District, the purchase of the necessary sites for school buildings, the purchase of new school buses and other new vehicles to be used for student transportation and the purchase or retrofitting of vehicles to be used for emergency, safety, or security purposes, and the levying and imposition of taxes sufficient to pay the principal of and interest on the bonds and the costs of any credit agreements.
choices:
- For
- Against
