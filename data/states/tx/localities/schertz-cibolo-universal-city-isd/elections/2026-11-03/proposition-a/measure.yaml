# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: Schertz-Cibolo-Universal City ISD, Proposition A
election_date: '2026-11-03'
kind: tax-rate
ballot_text: 'PROPOSITION A: THIS IS A TAX INCREASE. Ratifying the ad valorem tax rate of $1.1969 per $100 valuation in the Schertz-Cibolo-Universal City Independent School District for the current year, a rate that will result in an increase of 18 percent in maintenance and operations tax revenue for the District for the current year as compared to the preceding year, which is an additional $8,256,727 for the purpose of recruiting and retaining staff and maintaining program offerings for students.'
choices:
- FOR
- AGAINST
