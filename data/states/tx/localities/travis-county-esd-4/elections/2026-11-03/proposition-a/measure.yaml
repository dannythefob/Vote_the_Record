# Proposition: exact wording and choices as printed on the sample ballot. Unverified.
name: Travis County ESD No. 4, Proposition A
election_date: '2026-11-03'
kind: other
ballot_text: Adding all territory along the east shore of the Colorado River between Pennybacker Bridge and Emma Long Park that is currently not in Travis County ESD 4 into the Emergency Services District. Territory along the east shore of the Colorado River between Pennybacker Bridge and Emma Long Park assuming its proportionate share of the outstanding debts and taxes of the District.
choices:
- FOR
- AGAINST
