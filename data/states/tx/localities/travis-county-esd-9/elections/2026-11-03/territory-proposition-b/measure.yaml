ballot_text: The territory generally described as certain lots (and as applicable, tracts) fronting on Lake Austin between Tom Miller Dam and 2940 Oestrick Lane, to the extent such territory is described in City of Austin Ordinance Nos. 20251120-064, 20251211-089, 20251211-090, 20260122-063, 20260226-060, 20260226-062, 20260312-030, 20260326-057, 20260326-058, 20260326-063, 20260326-064, and 20260326-062 save and except for 3963 Westlake Drive, assuming its proportionate share of the outstanding debts and taxes of the Travis County Emergency Services District No. 9, if it is added to the district.
