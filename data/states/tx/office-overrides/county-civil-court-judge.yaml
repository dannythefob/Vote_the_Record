# Powers of a judge of a Harris County Civil Court at Law.
# Text checked against the Government Code (statutes.capitol.texas.gov, read through its
# document server tcss.legis.texas.gov) on 2026-09-30. Term of office not confirmed yet.
office_type: county-civil-court-judge
state: TX
powers:
  - id: P-CIVIL
    description: Hears civil cases where more than $500 and up to $325,000 is at stake.
    statute: Government Code § 25.0003(c)(1)
    source_url: https://statutes.capitol.texas.gov/Docs/GV/htm/GV.25.htm
    topics: [courts-justice]

  - id: P-APPEALS
    description: Hears appeals of civil cases from Justice of the Peace courts in Harris County.
    statute: Government Code § 25.1032(a)
    source_url: https://statutes.capitol.texas.gov/Docs/GV/htm/GV.25.htm
    topics: [courts-justice]

  - id: P-EMINENT-DOMAIN
    description: Handles eminent domain cases in Harris County, where the government takes private property for public use.
    statute: Government Code § 25.1032(c)
    source_url: https://statutes.capitol.texas.gov/Docs/GV/htm/GV.25.htm
    topics: [courts-justice, housing-land]

plain_summary:
  intro:
    text: Hears mid-size lawsuits (up to $325,000) and appeals from Justice of the Peace courts.
    powers: [P-CIVIL, P-APPEALS]
  points:
    - text: Hears lawsuits up to $325,000
      icon: court
      powers: [P-CIVIL]
    - text: Hears appeals from Justice of the Peace courts
      icon: gavel
      powers: [P-APPEALS]
    - text: Handles cases where the government takes private property for public use
      icon: contract
      powers: [P-EMINENT-DOMAIN]
