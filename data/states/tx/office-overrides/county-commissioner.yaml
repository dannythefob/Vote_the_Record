# Powers of a Texas county commissioner.
# Text checked against the Texas Constitution and statutes (statutes.capitol.texas.gov, read
# through its document server tcss.legis.texas.gov) on 2026-09-30; the budget, tax rate,
# contracts, and precincts sections are the ones checked for county-judge on 2026-09-29.
office_type: county-commissioner
state: TX
powers:
  - id: P-TERM
    description: The county is divided into four commissioner precincts. Each elects one commissioner to a four-year term. With the County Judge presiding, they form the Commissioners Court.
    statute: Texas Constitution art. V, § 18(b)
    source_url: https://statutes.capitol.texas.gov/Docs/CN/htm/CN.5.htm

  - id: P-BUDGET
    description: Votes, as a member of the Commissioners Court, on adopting the county budget. The vote to adopt it must be a record vote.
    statute: Local Government Code §§ 111.039, 111.068
    source_url: https://statutes.capitol.texas.gov/Docs/LG/htm/LG.111.htm
    topics: [taxes-budget]

  - id: P-TAX-RATE
    description: Votes, as a member of the county's governing body, on adopting the county property tax rate.
    statute: Tax Code § 26.05(a)
    source_url: https://statutes.capitol.texas.gov/Docs/TX/htm/TX.26.htm
    topics: [taxes-budget]

  - id: P-CONTRACTS
    description: Votes on county purchases. Contracts over $100,000 must use competitive bidding or another listed procedure unless the court grants an exemption.
    statute: Local Government Code §§ 262.023, 262.024
    source_url: https://statutes.capitol.texas.gov/Docs/LG/htm/LG.262.htm
    topics: [taxes-budget]

  - id: P-ROADS
    description: The Commissioners Court may exercise general control over all roads, highways, and bridges in the county.
    statute: Transportation Code § 251.016
    source_url: https://statutes.capitol.texas.gov/Docs/TN/htm/TN.251.htm
    topics: [roads-transportation]

  - id: P-PRECINCTS
    description: Votes, as a member of the Commissioners Court, on dividing the county into election precincts.
    statute: Election Code § 42.001(a)
    source_url: https://statutes.capitol.texas.gov/Docs/EL/htm/EL.42.htm
    topics: [elections]

plain_summary:
  intro:
    text: One of four members of the Commissioners Court, which sets the county budget and property tax rate and oversees county roads.
    powers: [P-TERM, P-BUDGET, P-TAX-RATE, P-ROADS]
  points:
    - text: Votes on the county budget and the property tax rate
      icon: budget
      powers: [P-BUDGET, P-TAX-RATE]
    - text: Votes on big county contracts and purchases
      icon: contract
      powers: [P-CONTRACTS]
    - text: Oversees county roads and bridges with the rest of the court
      icon: shield
      powers: [P-ROADS]
    - text: Votes on how the county is divided into voting precincts
      icon: vote
      powers: [P-PRECINCTS]
