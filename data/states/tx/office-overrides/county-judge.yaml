# Powers of a Texas county judge under state law.
# Text checked against statutes.capitol.texas.gov (current through the 89th Legislature,
# 2nd Called Session, 2025) on 2026-09-29. Harris County specifics belong elsewhere.
office_type: county-judge
state: TX
powers:
  - id: P-PRESIDE
    description: Sits on the Commissioners Court with the county commissioners, and presides when present.
    statute: Local Government Code § 81.001
    source_url: https://statutes.capitol.texas.gov/Docs/LG/htm/LG.81.htm

  - id: P-BUDGET
    description: Votes, as a member of the Commissioners Court, on adopting the county budget. The court may change the proposed budget, and the vote to adopt it must be a record vote.
    statute: Local Government Code §§ 111.039, 111.068
    source_url: https://statutes.capitol.texas.gov/Docs/LG/htm/LG.111.htm

  - id: P-TAX-RATE
    description: Votes, as a member of the county's governing body, on adopting the county property tax rate.
    statute: Tax Code § 26.05(a)
    source_url: https://statutes.capitol.texas.gov/Docs/TX/htm/TX.26.htm

  - id: P-DISASTER
    description: May declare a local state of disaster. Continuing or renewing it for more than seven days requires the consent of the Commissioners Court.
    statute: Government Code § 418.108(a)-(b)
    source_url: https://statutes.capitol.texas.gov/Docs/GV/htm/GV.418.htm

  - id: P-EVACUATION
    description: May order the evacuation of a threatened area and control entry to and movement within a disaster area, in both incorporated and unincorporated parts of the county. Where the county judge's and a mayor's decisions conflict, the county judge's decision prevails.
    statute: Government Code § 418.108(f)-(h)
    source_url: https://statutes.capitol.texas.gov/Docs/GV/htm/GV.418.htm

  - id: P-EMERGENCY-DIRECTOR
    description: Serves as the county's emergency management director, acting as the governor's designated agent and able to exercise the governor's emergency powers on an appropriate local scale.
    statute: Government Code § 418.1015(a)-(b)
    source_url: https://statutes.capitol.texas.gov/Docs/GV/htm/GV.418.htm

  - id: P-CONTRACTS
    description: Votes, as a member of the Commissioners Court, on county purchases. Contracts over $100,000 must use competitive bidding or another listed procedure unless the court grants an exemption, such as for a public calamity or to protect public health and safety.
    statute: Local Government Code §§ 262.023, 262.024
    source_url: https://statutes.capitol.texas.gov/Docs/LG/htm/LG.262.htm

  - id: P-PRECINCTS
    description: Votes, as a member of the Commissioners Court, on dividing the county into election precincts.
    statute: Election Code § 42.001(a)
    source_url: https://statutes.capitol.texas.gov/Docs/EL/htm/EL.42.htm

  - id: P-COUNTY-COURT
    description: Is elected to a four-year term and presides over the County Court, with judicial functions as provided by law.
    statute: Texas Constitution art. V, §§ 15-16
    source_url: https://statutes.capitol.texas.gov/Docs/CN/htm/CN.5.htm
