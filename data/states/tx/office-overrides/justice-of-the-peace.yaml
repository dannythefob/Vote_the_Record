# Powers of a Texas Justice of the Peace.
# Text checked against the Texas Constitution, Government Code, and Code of Criminal Procedure
# (statutes.capitol.texas.gov, read through its document server tcss.legis.texas.gov) on 2026-09-30.
# Term of office not confirmed yet.
office_type: justice-of-the-peace
state: TX
powers:
  - id: P-PRECINCTS
    description: Counties of 50,000 or more people are divided into 4 to 8 precincts. Each Justice of the Peace serves one precinct.
    statute: Texas Constitution art. V, § 18(a)
    source_url: https://statutes.capitol.texas.gov/Docs/CN/htm/CN.5.htm

  - id: P-CIVIL
    description: Hears civil cases where up to $20,000 is at stake, and eviction cases.
    statute: Government Code § 27.031
    source_url: https://statutes.capitol.texas.gov/Docs/GV/htm/GV.27.htm
    topics: [courts-justice, housing-land]

  - id: P-CRIMINAL
    description: Hears criminal cases punishable by a fine only.
    statute: Texas Constitution art. V, § 19; Code of Criminal Procedure art. 4.11
    source_url: https://statutes.capitol.texas.gov/Docs/CR/htm/CR.4.htm
    topics: [courts-justice]

plain_summary:
  intro:
    text: Handles small claims up to $20,000, evictions, and minor offenses that carry only a fine, such as many traffic tickets.
    powers: [P-CIVIL, P-CRIMINAL]
  points:
    - text: Hears small claims up to $20,000
      icon: court
      powers: [P-CIVIL]
    - text: Hears eviction cases
      icon: contract
      powers: [P-CIVIL]
    - text: Hears fine-only offenses, such as many traffic tickets
      icon: gavel
      powers: [P-CRIMINAL]
