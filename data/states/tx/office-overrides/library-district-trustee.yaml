# Powers of a Texas library district trustee.
# Text checked against Local Government Code chapter 326 (statutes.capitol.texas.gov, read through
# its document server tcss.legis.texas.gov) on 2026-10-01.
office_type: library-district-trustee
state: TX
powers:
  - id: P-PURPOSE
    description: A library district exists to set up, equip, and maintain one or more public libraries.
    statute: Local Government Code § 326.002
    source_url: https://statutes.capitol.texas.gov/Docs/LG/htm/LG.326.htm
    topics: [schools]

  - id: P-BOARD
    description: The district is governed by a board of five trustees, who serve two-year terms.
    statute: Local Government Code §§ 326.041, 326.043(a)
    source_url: https://statutes.capitol.texas.gov/Docs/LG/htm/LG.326.htm

  - id: P-SALES-TAX
    description: If the district adopts it, the district has a sales and use tax of up to one-half of one percent.
    statute: Local Government Code § 326.091(a)
    source_url: https://statutes.capitol.texas.gov/Docs/LG/htm/LG.326.htm
    topics: [taxes-budget]

plain_summary:
  intro:
    text: One of five trustees who run a public library district, which can be funded by a local sales tax.
    powers: [P-PURPOSE, P-BOARD, P-SALES-TAX]
  points:
    - text: Runs the district's public libraries
      icon: contract
      powers: [P-PURPOSE]
    - text: Funded by a sales tax of up to half a percent, if adopted
      icon: budget
      powers: [P-SALES-TAX]
