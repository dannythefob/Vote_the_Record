- id: tx/who-decides#property-taxes
  question: Who decides how much property tax I pay?
  short_answer: Several offices share it. Every local government that taxes your property, like your city, county, and school
    district, sets its own rate each year. An appraisal district values your property. State lawmakers set tax breaks like
    the homestead exemption.
  deciders:
  - office_types:
    - city-council-member
    - county-commissioner
    - school-trustee
    - community-college-trustee
    - water-district-director
    role: Each board sets its own tax rate every year.
    statute: Tax Code § 26.05
    source_url: https://statutes.capitol.texas.gov/Docs/TX/htm/TX.26.htm
  - office_types:
    - appraisal-district-director
    role: In counties with 75,000 or more people, three directors of the appraisal district board are elected by voters. The
      district appraises property values.
    statute: Tax Code § 6.0301
    source_url: https://statutes.capitol.texas.gov/Docs/TX/htm/TX.6.htm
  - office_types: *id001
    role: Set homestead exemptions, like the $140,000 exemption from school taxes.
    statute: Tax Code § 11.13
    source_url: https://statutes.capitol.texas.gov/Docs/TX/htm/TX.11.htm
