- id: tx/who-decides#minimum-wage
  question: Who decides the minimum wage?
  short_answer: Congress sets the federal minimum wage, and Texas law uses that same amount. Cities and counties can't set
    a higher minimum wage for private businesses.
  deciders:
  - office_types: *id002
    role: Set the federal minimum wage.
    statute: 29 U.S.C. § 206
    source_url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title29-section206&num=0&edition=prelim
  - office_types: *id001
    role: Tied the Texas minimum wage to the federal one and blocked local minimum wages for private businesses. Can change
      that.
    statute: Labor Code §§ 62.051, 62.0515
    source_url: https://statutes.capitol.texas.gov/Docs/LA/htm/LA.62.htm
  - office_types:
    - city-council-member
    - county-commissioner
    role: Can't set a higher minimum wage for private businesses, but can require one in their own contracts.
    statute: Labor Code § 62.0515
    source_url: https://statutes.capitol.texas.gov/Docs/LA/htm/LA.62.htm
  verification: unverified
  verified_on: null
  reviewer: null
