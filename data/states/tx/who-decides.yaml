- id: tx/who-decides#polling-places
  question: Who decides where I vote?
  short_answer: For November elections, the county clerk recommends a polling place for each precinct, and Commissioners Court
    approves it. In counties with more than 175,000 people, no voter may be sent more than 25 miles from home.
  deciders:
  - office_types:
    - county-clerk
    role: Recommend the polling place for each precinct.
    statute: Election Code § 43.002
    source_url: https://statutes.capitol.texas.gov/Docs/EL/htm/EL.43.htm
  - office_types:
    - county-commissioner
    role: Designate the polling places, unless there's good cause to reject the clerk's choice.
    statute: Election Code § 43.002
    source_url: https://statutes.capitol.texas.gov/Docs/EL/htm/EL.43.htm
  verification: unverified
  verified_on: null
  reviewer: null
