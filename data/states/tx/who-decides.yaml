- id: tx/who-decides#medicaid
  question: Who decides whether more people get Medicaid health coverage?
  short_answer: The U.S. Supreme Court ruled in 2012 that each state has a genuine choice whether to take part in the Medicaid
    expansion. In Texas, state lawmakers write the laws and the budget. Congress writes Medicaid law and decides what the
    federal government pays.
  deciders:
  - office_types: *id001
    role: Write state law and the state budget.
    statute: Texas Constitution art. III
    source_url: https://statutes.capitol.texas.gov/Docs/CN/htm/CN.3.htm
  - office_types: *id002
    role: Write federal Medicaid law, including what share the federal government pays.
    statute: 42 U.S.C. § 1396d
    source_url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title42-section1396d&num=0&edition=prelim
