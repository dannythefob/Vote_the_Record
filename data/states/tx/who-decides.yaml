- id: tx/who-decides#sanctuary-cities
  question: Can my city or county be a "sanctuary city" for immigrants?
  short_answer: No. A 2017 Texas law (Senate Bill 4) bans cities, counties, and their police, sheriffs, and prosecutors from
    adopting or enforcing policies that limit immigration enforcement. Local jails must generally honor federal immigration
    detainer requests. State lawmakers wrote that law. Congress writes the federal immigration laws themselves.
  deciders:
  - office_types: &id001
    - state-representative
    - state-senator
    role: Wrote the state law that bans local "sanctuary" policies, and can change it.
    statute: Government Code §§ 752.053, 752.056, 752.0565
    source_url: https://statutes.capitol.texas.gov/Docs/GV/htm/GV.752.htm
  - office_types:
    - city-council-member
    - county-commissioner
    - county-attorney
    role: Must follow the state law that bans sanctuary policies. A city or county that breaks it can be fined, and an official
      can be removed from office.
    statute: Government Code §§ 752.051, 752.053, 752.056, 752.0565
    source_url: https://statutes.capitol.texas.gov/Docs/GV/htm/GV.752.htm
  - office_types:
    - attorney-general
    role: Can take a city or county to court after a resident files a complaint, and must seek removal of an official when
      there is evidence the law was broken.
    statute: Government Code §§ 752.055, 752.0565
    source_url: https://statutes.capitol.texas.gov/Docs/GV/htm/GV.752.htm
  - office_types: &id002
    - us-representative
    - us-senator
    role: Write the federal immigration laws, such as the Immigration and Nationality Act.
    statute: 8 U.S.C. chapter 12
    source_url: https://uscode.house.gov/view.xhtml?path=/prelim@title8/chapter12&edition=prelim
