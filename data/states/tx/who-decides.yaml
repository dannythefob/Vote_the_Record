- id: tx/who-decides#abortion
  question: Who decides abortion laws in Texas?
  short_answer: State lawmakers. In 2022 the U.S. Supreme Court ruled that the authority to regulate abortion is returned
    to the people and their elected representatives, so each state sets its own laws. Texas law bans abortion unless a licensed
    doctor acts because the pregnant patient has a life-threatening physical condition caused or made worse by the pregnancy.
  deciders:
  - office_types: *id001
    role: Write and can change Texas's abortion laws.
    statute: Health and Safety Code chapter 170A
    source_url: https://statutes.capitol.texas.gov/Docs/HS/htm/HS.170A.htm
  sources:
  - title: Dobbs v. Jackson Women's Health Organization (U.S. Supreme Court, 2022)
    url: https://www.supremecourt.gov/opinions/21pdf/19-1392_6j37.pdf
  verification: unverified
  verified_on: null
  reviewer: null
