# DRAFT for owner review (2026-10-04): hypothetical scenarios for a county commissioner. Every
# scenario cites the powers it rests on; for Texas those are in
# data/states/tx/office-overrides/county-commissioner.yaml.
office_type: county-commissioner
tags:
  - raise-revenue
  - cut-spending
  - use-reserves
  - extend-as-recommended
  - extend-with-review
  - end-declaration
  - fast-contracting
  - competitive-bidding
  - split-contracting
  - fewer-precincts
  - more-precincts
  - keep-precincts
  - widen-road
  - transit-and-safety
  - maintain-first
scenarios:
  - id: S-01
    title: Budget shortfall
    powers: [P-BUDGET, P-TAX-RATE]
    scenario: Mid-year, county revenue comes in well below projections, leaving a gap in next year's budget. Which would you push for first?
    options:
      - {id: A, text: Raise the property tax rate to close the gap, tags: [raise-revenue]}
      - {id: B, text: Cut spending across county departments, tags: [cut-spending]}
      - {id: C, text: Draw on reserves for one year and revisit next year, tags: [use-reserves]}

  - id: S-02
    title: Extending a disaster declaration
    powers: [P-DISASTER-CONSENT]
    scenario: The county judge declared a local disaster after a flood. It will expire in seven days unless the Commissioners Court consents to continue it. Recovery is under way but uneven. How do you vote?
    options:
      - {id: A, text: Continue it for as long as emergency officials recommend, tags: [extend-as-recommended]}
      - {id: B, text: "Continue it, with a public review and a fresh vote every few weeks", tags: [extend-with-review]}
      - {id: C, text: "Let it end and rely on the county's normal authority", tags: [end-declaration]}

  - id: S-03
    title: Emergency repair contract
    powers: [P-CONTRACTS]
    scenario: After a disaster, the county needs debris removal and repairs worth tens of millions of dollars. The law lets the court skip competitive bidding in a public calamity. Which approach do you support?
    options:
      - {id: A, text: "Use the exemption and sign contracts within days, then audit afterward", tags: [fast-contracting]}
      - {id: B, text: "Bid the work competitively, even if it takes weeks", tags: [competitive-bidding]}
      - {id: C, text: "Use the exemption only for urgent work, and bid everything else", tags: [split-contracting]}

  - id: S-04
    title: Redrawing voting precincts
    powers: [P-PRECINCTS]
    scenario: Population growth means the county's election precincts must be redrawn. Which goal should guide the new lines?
    options:
      - {id: A, text: "Fewer, larger precincts, to lower election costs", tags: [fewer-precincts]}
      - {id: B, text: "More, smaller precincts, to shorten distances to polling places", tags: [more-precincts]}
      - {id: C, text: "Keep the current lines, changing them only where the law requires", tags: [keep-precincts]}

  - id: S-05
    title: A crowded county road
    powers: [P-ROADS, P-BUDGET]
    scenario: Traffic on a county road in a fast-growing area has doubled in five years, and the road budget can fund only one major project this year. Which do you support?
    options:
      - {id: A, text: Widen the road to add lanes, tags: [widen-road]}
      - {id: B, text: "Add sidewalks, bike lanes, and safer crossings, and work with transit to add service", tags: [transit-and-safety]}
      - {id: C, text: Repair existing county roads first and revisit the project next year, tags: [maintain-first]}
