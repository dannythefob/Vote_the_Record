# Site settings for src/build/build.py.
site_name: Vote the Record

# Shows the sitewide beta banner.
beta: true

# Corrections form: the site's own /report/ page (handled privately by the Worker in
# src/worker/). {id} is replaced by the URL-encoded item ID. Set to null to show
# "Corrections form coming soon" instead of links.
corrections_form_url: "/report/?item={id}"

source_code_url: https://github.com/dannythefob/Vote_the_Record

# Official voter information, by state. Shown on the home page.
official_links:
  TX:
    - name: VoteTexas.gov, the official Texas voter information site
      url: https://www.votetexas.gov/
    - name: How to register to vote
      url: https://www.votetexas.gov/register-to-vote/
    - name: Early voting in person
      url: https://www.votetexas.gov/faq/early-voting.html
    - name: Voting by mail
      url: https://www.votetexas.gov/voting-by-mail/
    - name: Important election dates (Texas Secretary of State)
      url: https://www.sos.state.tx.us/elections/voter/important-election-dates.shtml

# "Check your voter registration" button under Key dates on the home page, by state: the state's
# official lookup. Texas: the Secretary of State's "Am I Registered?" portal, as linked from
# https://www.votetexas.gov/register-to-vote/ (checked 2026-10-06).
registration_check:
  TX:
    name: the Texas Secretary of State's "Am I Registered?" lookup
    url: https://goelect.txelections.civixapps.com/ivis-mvp-ui/#/login

# Where candidates file campaign finance reports, shown on every race page.
# Federal offices file with the FEC. For a state, `state` covers state-level offices plus any
# office_types listed under state_office_types; `localities` names the filing office for listed
# office types in one locality; everything else gets the generic "filed locally" line.
campaign_finance:
  federal:
    name: Federal Election Commission
    url: https://www.fec.gov/data/
  tx:
    law_title: Texas Election Code, chapter 252
    law_url: https://statutes.capitol.texas.gov/Docs/EL/htm/EL.252.htm
    state:
      name: Texas Ethics Commission
      url: https://www.ethics.state.tx.us/search/cf/
    state_office_types: [district-judge]
    localities:
      harris-county:
        name: Harris County Clerk
        url: https://ethics.harrisvotes.com/
        office_types: [county-judge, county-commissioner, county-attorney, county-clerk, district-clerk,
                       county-treasurer, county-civil-court-judge, county-criminal-court-judge, probate-judge,
                       justice-of-the-peace, appraisal-district-director]
      # County and precinct offices and elected appraisal district directors: Election Code 252.005(2).
      travis-county:
        name: Travis County Clerk
        url: https://votetravis.gov/candidates-office-holders/campaign-finance/
        office_types: [county-judge, county-commissioner, county-attorney, county-clerk, district-clerk,
                       county-treasurer, county-court-at-law-judge, probate-judge, justice-of-the-peace,
                       constable, appraisal-district-director]
      city-of-austin:
        # Offices of a political subdivision other than a county: its clerk or secretary (252.005(3)).
        name: Austin City Clerk
        url: https://www.austintexas.gov/department/campaign-finance-reports
        office_types: [city-council-member, mayor]
      dallas-county:
        # The reports are posted on dallascounty.org; no page found names the office that receives them
        # (252.005(2): the county clerk, or the elections administrator in counties that have one).
        name: Dallas County
        published_on: Dallas County's Campaign Finance Reports page
        url: https://www.dallascounty.org/government/campaign-finance/
        office_types: [county-judge, county-commissioner, county-clerk, district-clerk, county-treasurer,
                       criminal-district-attorney, county-court-at-law-judge, county-criminal-court-judge,
                       county-criminal-appeals-judge, probate-judge, justice-of-the-peace, constable]

# Topics for the ballot page's "What matters to you?" picker, in display order. Keys must
# match the topic list in schemas/other.schema.json; each office power lists its topics.
topics:
  taxes-budget: Taxes & budget
  schools: Schools
  emergencies: Disasters & emergencies
  roads-transportation: Roads & transportation
  water-utilities: Water & utilities
  housing-land: Housing, land & property
  courts-justice: Courts & justice
  health: Health
  elections: Elections
  energy: Energy
