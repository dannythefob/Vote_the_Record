{# Simple line icons drawn for this site (24x24, stroked with currentColor via .icon in CSS).
   Decorative only: every icon sits next to text that says the same thing. #}
{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
{%- if name == "budget" or name == "money" -%}
<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v6M18 9v6"/>
{%- elif name == "storm" -%}
<path d="M7 16a4 4 0 0 1-.6-7.95A5.5 5.5 0 0 1 17 7.5a3.5 3.5 0 0 1 .5 7"/><path d="M13 12l-2.5 4h3L11 21"/>
{%- elif name == "shield" -%}
<path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z"/><path d="M9 12l2 2 4-4"/>
{%- elif name == "contract" or name == "document" -%}
<path d="M6 2.5h8l4 4v15H6z"/><path d="M14 2.5v4h4M9 11h6M9 14.5h6M9 18h4"/>
{%- elif name == "vote" -%}
<rect x="4" y="10" width="16" height="10.5" rx="1.5"/><path d="M8 10V4.5h8V10"/><path d="M9.5 7.5l1.5 1.5 3-3"/>
{%- elif name == "info" -%}
<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5v.5"/>
{%- elif name == "target" -%}
<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>
{%- elif name == "megaphone" -%}
<path d="M4 10v4h3l8 4.5V5.5L7 10z"/><path d="M18 9.5a3.5 3.5 0 0 1 0 5M7 14l1.5 5.5h2.5L10 15"/>
{%- elif name == "calendar" -%}
<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>
{%- elif name == "quiz" -%}
<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17v.5"/>
{%- else -%}
<circle cx="12" cy="12" r="3"/>
{%- endif -%}
</svg>
{%- endmacro %}
